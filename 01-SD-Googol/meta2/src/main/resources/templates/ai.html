<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Modo IA</title>
</head>
<body style="background:#181818;color:#f0f0f0;font-family:Arial;padding:20px">
  <h1>Modo IA</h1>
  <p><a href="/" style="color:#4ea3ff">⟵ Voltar</a></p>

  <form method="post" action="/ai">
    <input name="q" th:value="${q}"
           placeholder="Escreve a tua pergunta..."
           style="width:60%;padding:10px;border-radius:10px;border:1px solid #333;background:#222;color:#fff">
    <button type="submit" style="padding:10px 14px;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:#fff">
      Perguntar
    </button>
  </form>

  <div th:if="${answer != null}" style="margin-top:20px;white-space:pre-wrap">
    <h3>Resposta</h3>
    <div th:text="${answer}"></div>
  </div>
</body>
</html>
