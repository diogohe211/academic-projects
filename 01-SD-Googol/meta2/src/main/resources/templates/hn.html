<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Hacker News</title>
</head>
<body style="background:#181818;color:#f0f0f0;font-family:Arial;padding:20px">
  <h1>Hacker News</h1>
  <p><a href="/" style="color:#4ea3ff">⟵ Voltar</a></p>

  <div th:if="${error != null}" style="background:#2a2a2a;border:1px solid #444;padding:12px;border-radius:10px;margin:12px 0;">
    <b>Erro ao carregar:</b>
    <div th:text="${error}" style="white-space:pre-wrap;margin-top:6px;"></div>
  </div>

  <form method="get" action="/hn" style="margin:10px 0;">
    <label>Quantas notícias?</label>
    <input name="n" th:value="${n}" style="width:80px;padding:6px;margin-left:8px;">
    <button type="submit" style="padding:6px 12px;margin-left:8px;">Carregar</button>
  </form>

  <ol th:if="${items != null}">
    <li th:each="it : ${items}" style="margin-bottom:12px;">
      <a th:href="${it.url}" th:text="${it.title}" target="_blank" style="color:#4ea3ff"></a>
      <div style="color:#aaa;font-size:0.9rem;">
        <span th:text="'score: ' + ${it.score}"></span>
        <span th:text="' | by: ' + ${it.by}"></span>
      </div>
    </li>
  </ol>
</body>
</html>
